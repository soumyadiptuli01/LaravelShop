<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Admin Login</title><link rel="stylesheet" href="style.css"></head>
<body class="login-page">
  <main class="login-card">
    <div class="brand">Shop<span>Admin</span></div>
    <p>Sign in to manage your store.</p>
    <h1>Welcome back</h1>
    <form action="#" method="post">
      <div class="field"><label for="email">Email address</label><input id="email" name="email" type="email" placeholder="admin@example.com" required></div>
      <div class="field"><label for="password">Password</label><input id="password" name="password" type="password" placeholder="Enter your password" required></div>
      <button class="btn" type="submit">Sign in</button>
    </form>
    <p class="muted" style="font-size:12px;margin-top:20px">UI demo only. Connect this form to Laravel authentication.</p>
  </main>
</body></html>

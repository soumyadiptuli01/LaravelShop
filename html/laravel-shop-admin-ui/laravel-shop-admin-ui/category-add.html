<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Add Category | ShopAdmin</title><link rel="stylesheet" href="style.css"></head>
<body><div class="layout"><aside class="sidebar"><div class="brand">Shop<span>Admin</span></div><div class="nav-label">Workspace</div><nav class="nav"><a href="dashboard.html">▦ &nbsp; Dashboard</a><a href="products.html">▣ &nbsp; Products</a><a class="active" href="categories.html">▤ &nbsp; Categories</a><a href="orders.html">▧ &nbsp; Orders</a><a href="customers.html">♙ &nbsp; Customers</a><a href="login.html">↪ &nbsp; Logout</a></nav></aside>
<main class="main"><header class="topbar"><span class="small">Categories / Add category</span><span class="admin">Admin ▾</span></header><section class="content">
<div class="page-head"><div><h1>Add category</h1><p>Create a category to organise your products.</p></div><a class="btn secondary" href="categories.html">← Back to categories</a></div>
<div class="form-card"><form action="#" method="post"><div class="form-grid">
<div class="field full"><label for="name">Category name *</label><input id="name" name="name" placeholder="e.g. Clothing" required></div>
<div class="field full"><label for="description">Description</label><textarea id="description" name="description" placeholder="Short category description..."></textarea></div>
<div class="field full"><label for="status">Status</label><select id="status" name="status"><option value="active">Active</option><option value="inactive">Inactive</option></select></div>
</div><div class="form-actions"><button class="btn" type="submit">Save category</button><a class="btn secondary" href="categories.html">Cancel</a></div></form></div>
</section></main></div></body></html>
